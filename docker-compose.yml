services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    # ❌ NO PORTS EXPOSED

  mongodb:
    image: mongo:7
    restart: always
    volumes:
      - mongodb_data:/data/db
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal

  neo4j:
    image: neo4j:5
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    volumes:
      - neo4j_data:/data
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
      - mongodb
      - redis
      - neo4j
      - meilisearch
    networks:
      - internal
      - public
    volumes:
      - backend_uploads:/app/uploads
    command: sh -c "pnpm prisma generate && pnpm start"
    healthcheck:
      test: ["CMD-SHELL", "wget -O - --server-response http://127.0.0.1:3000/api/v1/feed 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ../Ding-Platform-Frontend
      dockerfile: Dockerfile.dev
    restart: always
    env_file:
      - ../Ding-Platform-Frontend/.env
    volumes:
      - ../Ding-Platform-Frontend:/app
      - /app/node_modules
    networks:
      - public

  # MeiliSearch
  meilisearch:
    image: getmeili/meilisearch:v1.5
    container_name: ding-meilisearch-dev
    restart: always
    ports:
      - '7700:7700'
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_API_KEY:-masterKey123}
      - MEILI_ENV=development
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - internal

volumes:
  pgdata:
  mongodb_data:
  redis_data:
  neo4j_data:
  meilisearch_data:
  backend_uploads:

networks:
  internal:
    internal: true
  public: