services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    # ❌ NO PORTS EXPOSED

  mongodb:
    image: mongo:7
    restart: always
    volumes:
      - mongodb_data:/data/db
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - internal

  neo4j:
    image: neo4j:5
    restart: always
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH}
    volumes:
      - neo4j_data:/data
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
      - mongodb
      - redis
      - neo4j
    networks:
      - internal
      - public
    # ❌ NO VOLUMES
    command: sh -c "pnpm prisma generate && pnpm start"

  frontend:
    build:
      context: ../Ding-Platform-Frontend
      dockerfile: Dockerfile.dev
    restart: always
    networks:
      - public

volumes:
  pgdata:
  mongodb_data:
  redis_data:
  neo4j_data:

networks:
  internal:
    internal: true
  public: