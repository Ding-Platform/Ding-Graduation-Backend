##
## Host Nginx (NOT Docker) reverse proxy for Ding backend.
##
## Expected Docker publish (see Ding-Platform-Backend/docker-compose.prod.yml):
##   - 127.0.0.1:3000:3000
##
## Usage (on the server):
##   sudo cp host.ding-backend.http.conf /etc/nginx/sites-available/ding-backend.conf
##   sudo ln -sf /etc/nginx/sites-available/ding-backend.conf /etc/nginx/sites-enabled/ding-backend.conf
##   sudo nginx -t && sudo systemctl reload nginx
##

upstream ding_backend {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 10M;

  location / {
    proxy_pass http://ding_backend;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (safe even if unused)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

