services:
  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: ding-prisma-studio-dev
    restart: always
    ports:
      - '5555:5555'
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - postgres
    networks:
      - ding-dev-network
    command: sh -c "pnpm prisma generate && npx prisma studio --hostname 0.0.0.0 --port 5555"

volumes:
  pgdata_dev:
  neo4j_data_dev:
  redis_data_dev:
  mongodb_data_dev:

networks:
  ding-dev-network:
    driver: bridge