        const rawMd = `# Ding Platform: Detailed API Workflows & Processes
**Prepared for: Graduation Project Documentation**

This document provides an in-depth, microscopic look at the platform's core API workflows. Instead of a single monolithic map, the architecture is broken down into specific real-world processes. Each section features a dedicated sequence/flow diagram illustrating exactly how endpoints, services, background processors, and databases interact.

---

## 1. Content Publication & AI Safety Pipeline (\`POST /api/posts\`)

When a user publishes a post, the request must be highly responsive. Therefore, the core service immediately writes to PostgreSQL and returns a \`201 Created\` response. However, this action silently triggers a massive background cascade to update the social graph, analyze sentiment, and push notifications.

\`\`\`mermaid
sequenceDiagram
    participant Client
    participant AuthGuard
    participant PostController
    participant PostService
    participant Postgres as PostgreSQL
    participant Background as Message Queue / Background
    participant Neo4j
    participant NoroAI as Sentiment & Noro AI

    Client->>AuthGuard: POST /api/posts (Bearer Token)
    AuthGuard-->>PostController: Valid User Payload
    PostController->>PostService: execute(CreatePostDTO)
    PostService->>Postgres: Insert Post & Media URLs
    Postgres-->>PostService: Return Post Entity
    PostService-->>Client: 201 Created (Fast UX)
    
    %% Background Cascade
    Note over PostService, Background: Asynchronous Event Cascade
    PostService-)+Background: Emit 'post.created' Event
    
    par Graph Sync
        Background->>Neo4j: Merge (User)-[:POSTED]->(Post)
    and Feed Update
        Background->>Postgres: Update Follower Timelines
    and AI Safety Check
        Background->>NoroAI: Analyze Text Sentiment
        alt Negative Sentiment Detected
            NoroAI->>Postgres: Log 'UserMoodProfile' Drop
            NoroAI->>Client: Send AI Intervention Socket Message
        end
    end
\`\`\`

---

## 2. Social Graph Interaction Pipeline (\`POST /api/social/like\`)

A simple "like" on the platform is not just a counter increment. It is the fundamental building block of the platform's Feed Recommendation Algorithm.

\`\`\`mermaid
flowchart TD
    %% Request Layer
    Client([User App]) -->|POST /api/social/like| Controller[Like Controller]
    Controller --> Service[Like Service]
    
    %% Synchronous Layer
    Service -->|1. Validate| Postgres[(PostgreSQL: Likes Table)]
    Service -.->|2. Respond 200 OK| Client
    
    %% Asynchronous Cascade
    Service -->|3. Emit Event| EventBus{Internal Event Bus}
    
    %% Graph Processing
    EventBus -->|Async| GraphProcessor[Graph Sync Processor]
    GraphProcessor -->|Merge Edge| Neo4j[(Neo4j: Social Graph)]
    
    %% Neo4j Logic
    Neo4j -->|If edge exists| Inc[Increment 'score' property]
    Neo4j -->|If new edge| Create[Create :INTERACTED_WITH edge]
    
    %% Recalculation
    Inc --> FeedEngine[Feed Algorithm Engine]
    FeedEngine -->|Increase Author Ranking| Postgres
\`\`\`

---

## 3. Commerce & Escrow Lifecycle (\`POST /api/marketplace/buy\`)

Financial transactions require strict sequential enforcement. The marketplace utilizes a multi-step Escrow state machine (\`DealLogs\`) to prevent fraud between buyers and sellers.

\`\`\`mermaid
sequenceDiagram
    participant Buyer
    participant MarketAPI as Marketplace Controller
    participant SellerGuard as Seller Verification Guard
    participant TransactionSvc as Transaction Service
    participant Postgres as DB (Orders & Escrow)
    participant Notification as Notification Engine
    participant Seller

    Buyer->>MarketAPI: POST /api/marketplace/buy
    MarketAPI->>SellerGuard: Verify Seller Account Active?
    SellerGuard-->>MarketAPI: Proceed
    MarketAPI->>TransactionSvc: Process Checkout
    
    %% Escrow Locking
    TransactionSvc->>Postgres: Deduct Inventory
    TransactionSvc->>Postgres: Create Order (Status: PENDING)
    TransactionSvc->>Postgres: Append DealLog (FUNDS_LOCKED)
    TransactionSvc-->>Buyer: 200 OK (Payment Held in Escrow)
    
    %% Notification
    TransactionSvc-)+Notification: Alert Seller
    Notification-->>Seller: Push: "Item Sold, Please Ship!"
    
    %% Follow Up Action
    Note over Buyer, Postgres: Days Later: Item Arrives
    Buyer->>MarketAPI: POST /api/marketplace/deliver
    MarketAPI->>TransactionSvc: Release Escrow
    TransactionSvc->>Postgres: Update Order (Status: DELIVERED)
    TransactionSvc->>Postgres: Append DealLog (FUNDS_RELEASED)
\`\`\`

---

## 4. Real-Time Chat & Signaling Pipeline (\`WSS /chat\`)

Unlike REST APIs, WebSockets require constant open connections. The platform uses specific Web Socket Guards to authorize the handshake before allowing TCP streams for direct messaging and WebRTC video call signaling.

\`\`\`mermaid
flowchart LR
    %% Clients
    UserA([Client A: Sender])
    UserB([Client B: Receiver])

    %% Gateway
    subgraph "WebSocket Gateway"
        Handshake[chat.middleware.ts]
        WSGuard[ws-jwt.guard.ts]
        WSCtrl[Chat Gateway/Controller]
    end

    %% Services
    ChatSvc[Chat Service]
    Postgres[(PostgreSQL)]
    Redis[(Redis Pub/Sub)]
    Notification[APN / FCM Push Notifications]

    %% Flow
    UserA -->|1. WSS Handshake + Token| Handshake
    Handshake --> WSGuard
    WSGuard -->|2. Valid Payload| WSCtrl
    
    WSCtrl -->|3. Send Message| ChatSvc
    ChatSvc -->|4. Save| Postgres
    
    ChatSvc -->|5. Broadcast| Redis
    Redis --> WSCtrl
    
    %% Delivery Decision
    WSCtrl -->|6a. User Online| UserB
    WSCtrl -->|6b. User Offline| Notification
    Notification -.->|Push Alert| UserB
\`\`\`

---

## 5. Summary of Architectural Resilience

By breaking the system down into these isolated, event-driven pipelines, the Ding Platform achieves **Architectural Resilience**:
1. **Fault Isolation:** If the Neo4j graph database goes offline, the REST API (Postgres) will still return \`200 OK\` for Likes and Posts. The Neo4j events will simply queue in the background.
2. **Horizontal Scalability:** The \`WebSocket Gateway\` uses Redis Pub/Sub, meaning chat connections can be distributed across dozens of Node.js instances seamlessly.
3. **Auditability:** The Escrow pipeline relies heavily on append-only \`DealLogs\`, ensuring that every financial state transition is permanently recorded for administrator review.
`;

            return originalCodeRenderer({text, lang, escaped});
